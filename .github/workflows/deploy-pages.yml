name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Durability: tag every push to main so the commit is GC-proof.
      # Prevents a repeat of the lost-branch incident (doc 08 §5):
      # a branch that lived only in a local worktree was GC'd when the
      # worktree was lost. Tags are never garbage-collected by git.
      # Spec: docs/architecture/master-architecture/08-integration-and-release-strategy.md §4
      - name: Tag merge commit for durability
        if: github.event_name == 'push'
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          TAG="build-${SHORT_SHA}"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
        continue-on-error: true

      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Verify asset base path
        run: |
          if ! grep -q '/Little-somewhere/assets/' dist/index.html; then
            echo "ERROR: dist/index.html is missing /Little-somewhere/ asset prefix"
            echo "--- dist/index.html ---"
            cat dist/index.html
            exit 1
          fi
          echo "Base path OK"
          cat dist/index.html

      # Always publish to gh-pages so branch-based Pages stays current
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
